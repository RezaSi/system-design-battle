port: 8080
host: http://localhost:8080
health_path: /healthz
warmup_seconds: 3

# Same 1 vCPU / 1 GB envelope as challenge-1. Every service must
# declare cpus + mem_limit; scripts/validate_budget.py rejects the
# stack if the sum exceeds the budget.
resource_budget:
  cpus: 1.0
  memory_mb: 1024

# Note: 429 responses from a working rate limiter are *not* failures.
# The Locust tasks treat 429 as success, so the error-rate column on
# the report only counts real errors (5xx, connection failures, etc.).

load_stages:
  - { name: "warmup",     users: 30,  spawn_rate: 30,  duration_s: 15, scored: false }
  - { name: "light",      users: 100, spawn_rate: 50,  duration_s: 20, scored: true  }
  - { name: "target",     users: 300, spawn_rate: 150, duration_s: 20, scored: true  }
  - { name: "heavy",      users: 800, spawn_rate: 400, duration_s: 20, scored: true  }
  - { name: "saturation", users: 1500, spawn_rate: 750, duration_s: 20, scored: true  }
