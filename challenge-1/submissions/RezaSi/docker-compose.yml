services:
  # Resource budget for the whole stack: 1.0 CPU / 1024 MB.
  # Two-container layout: a Go service, and Redis as the single source of
  # truth. No separate database — Redis with AOF (`appendonly yes`,
  # `appendfsync everysec`) on a named volume is durable enough to carry
  # URL mappings across `docker compose restart` with at most one second
  # of write loss.
  #
  # The split below leans memory on Redis (the only stateful service)
  # and CPU on the app, which is the request-handling hotspot.
  app:
    build: .
    cpus: 0.7
    mem_limit: 256m
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: cache:6379
      PUBLIC_HOST: http://localhost:8080
    depends_on:
      - cache
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    cpus: 0.3
    mem_limit: 768m
    # AOF for durability, fsync once per second is a good throughput/loss
    # trade-off (worst-case ~1s of writes lost across a hard restart).
    # `maxmemory` is set well below `mem_limit` to leave headroom for the
    # AOF rewrite buffer and Redis's own metadata.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - ""
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  redisdata:
