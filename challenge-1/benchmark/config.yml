port: 8080
host: http://localhost:8080
health_path: /healthz
warmup_seconds: 3

# Resource budget for the whole submission stack. Every service in the
# submission's docker-compose.yml must declare `cpus:` and `mem_limit:`,
# and the sum across services must not exceed this budget. The grader
# enforces this with scripts/validate_budget.py before starting the
# stack. How you split the budget across services is up to you — that's
# part of the design.
resource_budget:
  cpus: 1.0
  memory_mb: 1024

# Staged load profile. The bench runs Locust driving a LoadTestShape
# that walks these stages in order. The first stage is a warmup; all
# of them feed into the aggregated RPS and p99 numbers on the
# scoreboard.
load_stages:
  - { name: "warmup",     users: 20,  spawn_rate: 20,  duration_s: 15, scored: false }
  - { name: "light",      users: 50,  spawn_rate: 30,  duration_s: 20, scored: true  }
  - { name: "target",     users: 150, spawn_rate: 100, duration_s: 20, scored: true  }
  - { name: "heavy",      users: 400, spawn_rate: 250, duration_s: 20, scored: true  }
  - { name: "saturation", users: 800, spawn_rate: 400, duration_s: 20, scored: true  }
