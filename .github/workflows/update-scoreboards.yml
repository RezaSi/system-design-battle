name: Update Scoreboards

on:
  push:
    branches:
      - main
    paths:
      # Submission changes — re-bench only the changed challenge.
      - 'challenge-*/submissions/**'
      # Grader / benchmark spec / workflow changes — re-bench every
      # challenge so the scoreboard stays internally consistent
      # (detect step decides which based on the file paths in the diff).
      - 'scripts/**'
      - 'challenge-*/benchmark/**'
      - '.github/workflows/update-scoreboards.yml'
  workflow_dispatch:
    inputs:
      challenge:
        description: 'Specific challenge to refresh (e.g. challenge-1). Leave empty to refresh every challenge that has submissions.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-scoreboards
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'RezaSi/system-design-battle'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install grader dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Detect challenges to refresh
        id: detect
        run: |
          set -euo pipefail
          MANUAL="${{ github.event.inputs.challenge }}"
          EVENT="${{ github.event_name }}"
          if [ -n "$MANUAL" ]; then
            # Manual workflow_dispatch with an explicit challenge.
            echo "$MANUAL" > /tmp/changed_challenges.txt
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual dispatch with no specific challenge: refresh every
            # challenge that has at least one submission. Useful after
            # changing the grader itself (scripts/, workflows/) without
            # touching any submission file.
            git ls-tree -r --name-only HEAD \
              | grep -E '^challenge-[0-9]+/submissions/' \
              | awk -F'/' '{print $1}' | sort -u > /tmp/changed_challenges.txt || true
          elif ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            # Initial commit (no parent). Refresh every challenge that
            # has at least one submission so the scoreboard isn't stuck
            # at "no submissions yet" after the first push.
            git ls-tree -r --name-only HEAD \
              | grep -E '^challenge-[0-9]+/submissions/' \
              | awk -F'/' '{print $1}' | sort -u > /tmp/changed_challenges.txt || true
          else
            # Normal post-merge push: diff against parent.
            CHANGED_FILES=$(git diff --name-only HEAD~5 HEAD 2>/dev/null \
                           || git diff --name-only HEAD~1 HEAD 2>/dev/null \
                           || echo "")
            # If the grader itself changed (scripts/, the workflow, or a
            # benchmark spec under challenge-*/benchmark/), the existing
            # numbers on every scoreboard are stale. Refresh all
            # challenges in that case so the leaderboard stays
            # internally consistent.
            if echo "$CHANGED_FILES" | grep -qE '^(scripts/|\.github/workflows/update-scoreboards\.yml|challenge-[0-9]+/benchmark/)'; then
              echo "Grader changed; refreshing all challenges."
              git ls-tree -r --name-only HEAD \
                | grep -E '^challenge-[0-9]+/submissions/' \
                | awk -F'/' '{print $1}' | sort -u > /tmp/changed_challenges.txt || true
            else
              echo "$CHANGED_FILES" \
                | grep -E '^challenge-[0-9]+/submissions/' \
                | awk -F'/' '{print $1}' | sort -u > /tmp/changed_challenges.txt || true
            fi
          fi
          if [ ! -s /tmp/changed_challenges.txt ]; then
            echo "No challenges to refresh."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Challenges to refresh:"
          cat /tmp/changed_challenges.txt
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Refresh scoreboards
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/update_scoreboard.sh
          chmod +x scripts/run_benchmark.sh
          chmod +x scripts/parse_results.py
          while IFS= read -r challenge; do
            [ -n "$challenge" ] || continue
            echo "==== Updating scoreboard for $challenge ===="
            scripts/update_scoreboard.sh "$challenge" || echo "Failed to update $challenge (continuing)"
          done < /tmp/changed_challenges.txt

      - name: Regenerate main leaderboard in README
        if: steps.detect.outputs.has_changes == 'true'
        run: python3 scripts/generate_main_scoreboard.py

      - name: Commit and push updates
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add challenge-*/SCOREBOARD.md README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No scoreboard changes to commit."
            exit 0
          fi
          CHALLENGES=$(tr '\n' ' ' < /tmp/changed_challenges.txt)
          git commit -m "scoreboard: refresh $CHALLENGES"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            git fetch origin main
            # If a sibling run already pushed an identical scoreboard
            # (different commit SHA, same tree contents on the files we
            # care about), there is nothing to do. Without this guard we
            # would force a non-fast-forward push of our local commit
            # against an already-up-to-date remote and loop forever.
            if git diff --quiet origin/main -- 'challenge-*/SCOREBOARD.md' 'README.md'; then
              echo "Remote already has the same scoreboard contents. Nothing to push."
              PUSHED=1
              break
            fi
            if ! git diff --quiet HEAD origin/main; then
              git rebase origin/main || { git rebase --abort 2>/dev/null || true; git merge origin/main -m "Merge remote"; }
            fi
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              PUSHED=1
              break
            fi
            sleep $attempt
          done
          if [ "$PUSHED" = "0" ]; then
            echo "::error::All 5 push attempts failed. The scoreboard on main may be stale."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
